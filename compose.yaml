services:
  web:
    image: woki-landing:local
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.woki.pe}
        PUBLIC_NOINDEX: ${PUBLIC_NOINDEX:-false}
        PUBLIC_GOOGLE_SITE_VERIFICATION: ${PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        PUBLIC_GOOGLE_PLAY_URL: ${PUBLIC_GOOGLE_PLAY_URL:-}
        PUBLIC_CONTACT_FORM_ENDPOINT: ${PUBLIC_CONTACT_FORM_ENDPOINT:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
